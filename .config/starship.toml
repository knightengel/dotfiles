# ─────────────────────────────────────────────────────────────
# STARSHIP — ICE GLASS ONE-LINE FULL
# Left:  ~/project >
# Right: node/bun/py/rs/go/docker/nix main ?1 took 1s 22:30
# ─────────────────────────────────────────────────────────────

"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
command_timeout = 1200
palette = "ice"

format = "$directory $character"
right_format = "$nodejs$bun$deno$python$rust$golang$nix_shell$docker_context$git_branch$git_status$cmd_duration$status"

# ─────────────────────────────────────────────────────────────
# Palette
# ─────────────────────────────────────────────────────────────

[palettes.ice]
deep = "#04131f"
blue = "#2c92c8"
sky = "#5cc8ff"
ice = "#9fe7f7"
snow = "#eefbff"
mist = "#8fb6c9"
green = "#79cbbd"
yellow = "#d9cb93"
orange = "#d99a7a"
red = "#d98aa0"
purple = "#b4c5f3"
dim = "#4f7890"

# ─────────────────────────────────────────────────────────────
# Left side
# ─────────────────────────────────────────────────────────────

[directory]
format = "[$path]($style)"
style = "bold ice"
truncation_length = 4
truncate_to_repo = false
home_symbol = "~"
read_only = " ro"
read_only_style = "bold red"

[directory.substitutions]
"~/dotfiles" = "dotfiles"
"Documents" = "docs"
"Downloads" = "down"
"Desktop" = "desk"
"Developer" = "dev"
"Projects" = "projects"
"dotfiles" = "dotfiles"
".config" = "config"

[character]
success_symbol = "[>](bold sky) "
error_symbol = "[>](bold red) "
vimcmd_symbol = "[<](bold yellow) "
vimcmd_replace_one_symbol = "[<](bold orange) "
vimcmd_replace_symbol = "[<](bold orange) "
vimcmd_visual_symbol = "[<](bold purple) "

# ─────────────────────────────────────────────────────────────
# Languages / runtimes
# ─────────────────────────────────────────────────────────────

[nodejs]
disabled = false
format = "[node:$version](fg:green) "
detect_files = ["package.json", ".node-version", ".nvmrc"]
detect_folders = ["node_modules"]

[bun]
disabled = false
format = "[bun:$version](fg:yellow) "
detect_files = ["bun.lock", "bun.lockb"]

[deno]
disabled = false
format = "[deno:$version](fg:green) "
detect_files = ["deno.json", "deno.jsonc"]

[python]
disabled = false
format = "[py:$version${virtualenv}](fg:yellow) "
python_binary = ["python3", "python"]
detect_files = [
  "pyproject.toml",
  "requirements.txt",
  "setup.py",
  "Pipfile",
  "poetry.lock",
]
detect_folders = [".venv", "venv"]

[rust]
disabled = false
format = "[rs:$version](fg:orange) "
detect_files = ["Cargo.toml"]

[golang]
disabled = false
format = "[go:$version](fg:sky) "
detect_files = ["go.mod"]

[nix_shell]
disabled = false
format = "[nix:$state](fg:ice) "

[docker_context]
disabled = false
format = "[docker:$context](fg:blue) "
detect_files = [
  "docker-compose.yml",
  "docker-compose.yaml",
  "Dockerfile",
  "compose.yml",
  "compose.yaml",
]

# ─────────────────────────────────────────────────────────────
# Git
# ─────────────────────────────────────────────────────────────

[git_branch]
format = "[$branch](bold purple)"
style = "bold purple"
only_attached = true

[git_status]
format = " [$all_status$ahead_behind](bold red)"
style = "bold red"
conflicted = "conflict "
ahead = "↑${count} "
behind = "↓${count} "
diverged = "↕↑${ahead_count}↓${behind_count} "
up_to_date = ""
untracked = "?${count} "
stashed = "stash "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "x${count} "

# ─────────────────────────────────────────────────────────────
# Command info
# ─────────────────────────────────────────────────────────────

[cmd_duration]
min_time = 500
format = " [took $duration](fg:dim)"
show_milliseconds = false

[status]
disabled = false
format = " [exit:$status](fg:red)"

[time]
disabled = false
time_format = "%H:%M"
format = " [$time](fg:mist)"

# ─────────────────────────────────────────────────────────────
# Disabled noise
# ─────────────────────────────────────────────────────────────

[os]
disabled = true

[username]
disabled = true

[hostname]
disabled = true

[package]
disabled = true

[battery]
disabled = true

[jobs]
disabled = true

[aws]
disabled = true

[gcloud]
disabled = true

[azure]
disabled = true

[kubernetes]
disabled = true

[terraform]
disabled = true

[helm]
disabled = true

[java]
disabled = true

[kotlin]
disabled = true

[lua]
disabled = true

[perl]
disabled = true

[php]
disabled = true

[ruby]
disabled = true

[swift]
disabled = true

