# ─────────────────────────────────────────────────────────────
# STARSHIP — ICE GLASS MINIMAL
# Под прозрачный Ghostty: без плашек, без иконок, без квадратов
# ─────────────────────────────────────────────────────────────

"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
command_timeout = 1200
palette = "ice"

format = """
$directory$git_branch$git_status$cmd_duration
$character"""

right_format = """
$nodejs$python$rust$golang$bun$nix_shell$docker_context$status$time
"""

[palettes.ice]
deep = "#04131f"
blue = "#2c92c8"
sky = "#5cc8ff"
ice = "#9fe7f7"
snow = "#eefbff"
mist = "#8fb6c9"
green = "#79cbbd"
yellow = "#d9cb93"
orange = "#d99a7a"
red = "#d98aa0"
purple = "#b4c5f3"

[directory]
format = "[$path]($style)"
style = "bold ice"
truncation_length = 4
truncate_to_repo = false
home_symbol = "~"
read_only = " ro"

[directory.substitutions]
"Documents" = "docs"
"Downloads" = "down"
"Desktop" = "desk"
"Developer" = "dev"
"Projects" = "projects"
"dotfiles" = "dotfiles"
".config" = "config"

[git_branch]
format = " [on](fg:mist) [$branch](bold purple)"
style = "bold purple"

[git_status]
format = " [$all_status$ahead_behind](bold red)"
conflicted = "conflict "
ahead = "↑${count} "
behind = "↓${count} "
diverged = "↕↑${ahead_count}↓${behind_count} "
untracked = "?${count} "
stashed = "stash "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "x${count} "

[cmd_duration]
min_time = 500
format = " [took $duration](fg:mist)"

[character]
success_symbol = "[❯](bold sky) "
error_symbol = "[❯](bold red) "
vimcmd_symbol = "[❮](bold yellow) "
vimcmd_replace_one_symbol = "[❮](bold orange) "
vimcmd_replace_symbol = "[❮](bold orange) "
vimcmd_visual_symbol = "[❮](bold purple) "

[time]
disabled = false
time_format = "%H:%M"
format = "[$time](fg:mist) "

[nodejs]
format = "[node:$version](fg:green) "
detect_files = ["package.json", ".node-version"]
detect_folders = ["node_modules"]

[bun]
format = "[bun:$version](fg:yellow) "
detect_files = ["bun.lock", "bun.lockb"]

[python]
format = "[py:$version](fg:yellow) "
python_binary = ["python3", "python"]
detect_files = ["pyproject.toml", "requirements.txt", "setup.py", "Pipfile"]
detect_folders = [".venv", "venv"]

[rust]
format = "[rs:$version](fg:orange) "
detect_files = ["Cargo.toml"]

[golang]
format = "[go:$version](fg:sky) "
detect_files = ["go.mod"]

[nix_shell]
format = "[nix:$state](fg:ice) "

[docker_context]
format = "[docker:$context](fg:blue) "

[status]
disabled = false
format = "[exit:$status](fg:red) "

[os]
disabled = true

[username]
disabled = true

[hostname]
disabled = true

[package]
disabled = true

[battery]
disabled = true

[jobs]
disabled = true

[aws]
disabled = true

[gcloud]
disabled = true

[azure]
disabled = true

[kubernetes]
disabled = true

[terraform]
disabled = true

[helm]
disabled = true

[java]
disabled = true

[kotlin]
disabled = true

[lua]
disabled = true

[perl]
disabled = true

[php]
disabled = true

