[mgr]
cwd = { fg = "#9fe7f7", bold = true }

hovered = { fg = "#04131f", bg = "#5cc8ff", bold = true }
preview_hovered = { fg = "#04131f", bg = "#9fe7f7", bold = true }

find_keyword = { fg = "#d9cb93", bold = true }
find_position = { fg = "#d98aa0", bold = true }

marker_copied = { fg = "#79cbbd", bg = "#79cbbd" }
marker_cut = { fg = "#d98aa0", bg = "#d98aa0" }
marker_marked = { fg = "#5cc8ff", bg = "#5cc8ff" }
marker_selected = { fg = "#b4c5f3", bg = "#b4c5f3" }

tab_active = { fg = "#04131f", bg = "#5cc8ff", bold = true }
tab_inactive = { fg = "#8fb6c9", bg = "#071d2f" }
tab_width = 1

border_symbol = "│"
border_style = { fg = "#2c92c8" }

[status]
separator_open = ""
separator_close = ""
separator_style = { fg = "#5cc8ff", bg = "#5cc8ff" }

mode_normal = { fg = "#04131f", bg = "#5cc8ff", bold = true }
mode_select = { fg = "#04131f", bg = "#d9cb93", bold = true }
mode_unset = { fg = "#04131f", bg = "#d98aa0", bold = true }

[filetype]
rules = [
  { mime = "image/*", fg = "#b4c5f3" },
  { mime = "video/*", fg = "#d98aa0" },
  { mime = "audio/*", fg = "#d9cb93" },
  { mime = "application/zip", fg = "#d99a7a" },
  { mime = "application/gzip", fg = "#d99a7a" },
  { mime = "application/x-tar", fg = "#d99a7a" },
  { mime = "application/json", fg = "#79cbbd" },
  { mime = "text/*", fg = "#d8f4ff" },
  { name = "*/", fg = "#5cc8ff", bold = true },
  { name = "*", fg = "#d8f4ff" }
]
